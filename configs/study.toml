project = "MARS-TITAN"
status = "design_only"
seed_selection = 42
evaluation_seeds = [17, 42, 123]

[data]
source = "FinMultiTime"
market = "US"
scope = "bounded_confirmatory_comparison"
pilot_max_assets = 64
max_assets = 128
inventory_complete_source = true
full_dataset_training = "optional_after_profile"
frequency = "daily"
timezone = "America/New_York"
news_date_only_lag_sessions = 1
charts = "regenerate_from_past_only"
fundamentals = "require_publication_evidence"

[target]
type = "market_residual"
entry = "next_session_open"
exit = "next_session_close"
horizon_sessions = 1
coefficient_window_sessions = 252
minimum_history_sessions = 126

[validation]
method = "expanding_walk_forward"
minimum_train_months = 36
tuning_months = 6
calibration_months = 3
evaluation_months = 3
step_months = 3
final_holdout_months = 12
purge_overlapping_labels = true
reset_memory_each_fold = true
max_configs_per_family = 10

[compute]
device = "cuda:0"
allow_cpu_fallback = false
planning_vram_gib = 8
initial_context_sessions = 64
initial_latent_dimension = 64
initial_batch_size = 16
maximum_epochs = 30
host_ram_nominal_gb = 32
gpu_variant = "RTX 4070 Max-Q 8 GB"
checkpoint_policy = "configs/checkpoints.toml"

[memory_candidate]
status = "unimplemented_hypothesis"
episodic_capacity = 8192
episodic_dimension = 128
episodic_base_dimension = 256
retrieval_top_k = 8
key_projection = "fixed_seeded_projection"
read_weights = "softmax_within_selected_entries"
selector_priority = "immutable_admission_score"
internal_steps = [1, 2, 4]
freeze_memory_during_query = true
freeze_encoder_within_evaluation_fold = true
require_prediction_ledger_for_surprise = true
parametric_consolidation = "training_and_scheduled_past_only_refits"

[evaluation]
primary_metric = "session_mean_residual_mae"
cost_bps_per_side = [0, 5, 10, 20]
long_gross_weight = 0.5
short_gross_weight = 0.5
liquidate_at_close = true
interval_levels = [0.80, 0.95]
