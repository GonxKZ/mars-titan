name: Quality

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'test/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.16'
          enable-cache: true
      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep cmake build-essential
      - name: Instalar entorno de calidad
        run: uv sync --locked
      - name: Revisar código
        run: uv run ruff check .
      - name: Revisar formato
        run: uv run ruff format --check .
      - name: Ejecutar pruebas
        run: uv run pytest
      - name: Verificar documentación y metadatos
        run: uv run python scripts/check_repository.py
      - name: Verificar configuración C y C++
        run: cmake -S native -B native/build -DMARS_TITAN_ENABLE_CUDA=OFF
