[project]
name = "mars-titan"
version = "0.1.0"
description = "Base reproducible de investigación en memoria adaptativa y predicción financiera multimodal"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Gonzalo García Lama"}]
dependencies = [
    "numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=18,<30",
    "exchange-calendars>=4.8,<5", "ijson>=3.3,<4", "pillow>=11,<13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
mars-data = "mars_titan.data.cli:main"

[project.optional-dependencies]
data = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "polars>=1,<2",
    "pyarrow>=18,<30",
    "duckdb>=1.2,<2",
    "beautifulsoup4>=4.14,<5",
    "protego>=0.5,<1",
    "lxml>=6,<7",
]
research = [
    "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "scipy>=1.14,<2",
    "arch==8.0.0", "statsmodels==0.15.0",
]
cuda = ["torch>=2.8,<3; sys_platform == 'linux' and platform_machine == 'x86_64'"]
encoders = ["torchvision>=0.23,<1", "transformers>=4.57,<6", "huggingface-hub>=0.34,<2", "safetensors>=0.5,<1"]
notebooks = ["jupyterlab>=4.6.4,<5", "ipykernel>=6,<8"]
boosting = [
    "cupy-cuda13x==14.2.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "xgboost==3.3.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
reinforcement = [
    "gymnasium==1.3.0",
    "hmmlearn==0.3.3",
]
optimizers = [
    "schedulefree==1.4.1",
]

[project.urls]
Repository = "https://github.com/GonxKZ/mars-titan"

[dependency-groups]
dev = [
    "pytest>=8.3,<10", "ruff>=0.11,<1", "pyyaml>=6,<7", "bibtexparser>=1.4,<2",
    "coverage==7.16.1", "radon==6.0.1", "memray==1.20.0 ; sys_platform == 'linux'",
    "pytest-xdist==3.8.0",
]
# Bibliotecas externas que solo sirven de referencia en las pruebas de paridad (#494 a #497).
# No forman parte del entorno de ejecución y se instalan con
# `uv sync --locked --all-extras --group reference`, que conserva los extras.
reference = [
    "peft==0.21.0",
    "accelerate==1.15.0",
    "scoringrules==0.11.0",
    "mapie==1.5.0",
    "sb3-contrib==2.9.0",
    "stable-baselines3==2.9.0",
]

[tool.uv]
package = true
# Solo versiones publicadas al menos dos semanas antes de la revisión de bibliotecas (#490).
exclude-newer = "2026-09-26T23:59:59Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}]
torchvision = [{index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests/models/titans"]
addopts = "-ra"
markers = [
    "cuda: necesita cuda:0. Sin CUDA visible se omite con su motivo y nunca pasa a CPU",
    "native: necesita un artefacto nativo. Con nombres de variables, se omite si falta alguno de sus artefactos",
    "slow: la suma de sus casos alcanza un segundo según las medidas de tests/slow_tests.txt",
    "unguarded_fit: ajusta sin pasar por un punto de entrada protegido. Se omite mientras rige el bloqueo de aprendizaje",
    "native_binding: necesita el enlace nativo. Con MARS_TITAN_REQUIRE_NATIVE=1, omitirla falla",
    "external_reference: compara con el grupo reference. Con MARS_TITAN_REQUIRE_REFERENCE=1, omitirla falla",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
